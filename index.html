    <script>
      (function () {
        try {
          var isExt = function (src, err) {
            var s = String(src || '');
            var st = String((err && err.stack) || '');
            return (
              s.indexOf('chrome-extension://') === 0 ||
              s.indexOf('moz-extension://') === 0 ||
              st.indexOf('chrome-extension://') !== -1 ||
              st.indexOf('moz-extension://') !== -1
            );
          };
          window.addEventListener(
            'error',
            function (e) {
              if (e && isExt(e.filename, e.error)) {
                e.preventDefault();
                e.stopImmediatePropagation();
              }
            },
            true
          );
          window.addEventListener(
            'unhandledrejection',
            function (e) {
              var reason = e && e.reason;
              if (reason && isExt('', reason)) {
                e.preventDefault();
                e.stopImmediatePropagation();
              }
            },
            true
          );
        } catch (_e) {}
      })();
    </script>
